<!-- RFI Form -->
<template>
    <lightning-card>
        <div class="slds-grid slds-wrap slds-gutters_medium slds-m-around_xx-small" style="min-height:100px;">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-2">
                <!-- Loading state -->
                <template if:false={hasData}>
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </template>

                <template if:true={hasData}>
                    <div class="slds-p-vertical_small">
                        <template for:each={fields} for:item="f" for:index="index">
                            <div key={f.key} class="slds-m-vertical_x-small">
                                <!-- Address -->
                                <template lwc:if={f.isAddress}>
                                    <div class="slds-m-bottom_x-small slds-form-element">
                                        <lightning-input-address
                                                show-address-lookup="true"
                                                address-lookup-label="Address Lookup"
                                                address-label={f.fieldLabel}
                                                street-label="Street"
                                                city-label="City"
                                                province-label="State/Province"
                                                postal-code-label="Zip/Postal Code"
                                                country-label="Country"
                                                required={f.isRequired}
                                                data-field-name={f.name}
                                                country-options={countryOptions}
                                                province-options={stateOptions}
                                                onchange={handleAddressChange}>
                                        </lightning-input-address>
                                    </div>
                                </template>

                                <!-- School lookup using reusable lookup component -->
                                <template lwc:elseif={f.isSchoolLookup}>
                                    <div class="slds-m-bottom_x-small slds-form-element">
                                        <c-reusable-lookup
                                                label={f.fieldLabel}
                                                selected-icon-name="standard:account"
                                                object-label=""
                                                object-api-name="Account"
                                                field-api-name="Name"
                                                other-field-api-name="BillingCity,BillingState,billingPostalCode"
                                                placeholder="Search schools"
                                                required={f.isRequired}
                                                record-type-name='Educational Institution'
                                                onvalueselected={handleSchoolSelect}
                                        ></c-reusable-lookup>
                                    </div>
                                </template>

                                <!-- Picklist Program Lookup -->
                                <template lwc:elseif={f.isProgramLookup}>
                                    <c-multi-select-pills-groupable
                                            label={f.fieldLabel}
                                            name={f.name}
                                            options={f.programValues}
                                            value={f.value}
                                            required={f.isRequired}
                                            max={f.max}
                                            onchange={handleMultiSelectChange}
                                    ></c-multi-select-pills-groupable>
                                </template>

                                <!-- Picklist (single-select) -->
                                <template lwc:elseif={f.isPicklist}>
                                    <lightning-combobox
                                            label={f.fieldLabel}
                                            name={f.name}
                                            value={f.value}
                                            options={f.picklistValues}
                                            required={f.isRequired}
                                            onchange={handleChange}>
                                    </lightning-combobox>
                                </template>

                                <!-- Multi-select (custom) -->
                                <template lwc:elseif={f.isMultiSelect}>
                                    <c-multi-select-pills-groupable
                                            label={f.fieldLabel}
                                            name={f.name}
                                            options={f.picklistValues}
                                            value={f.value}
                                            required={f.isRequired}
                                            max={f.max}
                                            onchange={handleMultiSelectChange}
                                    ></c-multi-select-pills-groupable>
                                </template>

                                <!-- Textarea -->
                                <template lwc:elseif={f.isTextarea}>
                                    <lightning-textarea
                                            label={f.fieldLabel}
                                            name={f.fieldLeadAPIName}
                                            value={f.value}
                                            required={f.isRequired}
                                            onchange={handleChange}
                                    ></lightning-textarea>
                                </template>

                                <!-- Checkbox -->
                                <template lwc:elseif={f.isCheckbox}>
                                    <lightning-input
                                            type="checkbox"
                                            label={f.fieldLabel}
                                            name={f.fieldLeadAPIName}
                                            checked={f.value}
                                            required={f.isRequired}
                                            value={f.value}
                                            onchange={handleChange}
                                    ></lightning-input>
                                </template>

                                <template lwc:elseif={f.isTel}>
                                    <lightning-input
                                            type="tel"
                                            pattern="^\+?(\d{1,3})?[\-.\s]?\(?\d{1,4}\)?[\-.\s]?\d{1,4}[\-.\s]?\d{1,9}$"
                                            message-when-pattern-mismatch="Please enter a valid phone number (e.g., (123)456-7890, +1234567890, 123-456-7890)."
                                            label={f.fieldLabel}
                                            name={f.fieldLeadAPIName}
                                            value={f.value}
                                            required={f.isRequired}
                                            onchange={handleChange}>
                                    </lightning-input>
                                </template>

                                <template lwc:elseif={f.isEmail}>
                                    <lightning-input
                                            type="email"
                                            pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,4}$"
                                            message-when-pattern-mismatch="Please enter a valid email add."
                                            label={f.fieldLabel}
                                            name={f.fieldLeadAPIName}
                                            value={f.value}
                                            required={f.isRequired}
                                            onchange={handleChange}>
                                    </lightning-input>
                                </template>

                                <!-- Default inputs: text, date, etc. -->
                                <template lwc:else>
                                    <lightning-input
                                            type={f.inputType}
                                            label={f.fieldLabel}
                                            name={f.fieldLeadAPIName}
                                            value={f.value}
                                            required={f.isRequired}
                                            onchange={handleChange}>
                                    </lightning-input>
                                </template>
                            </div>
                        </template>

                        <div class="slds-m-top_medium">
                            <lightning-button variant="brand" label="Submit" onclick={handleSubmit} disabled={saving}></lightning-button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </lightning-card>
</template>
