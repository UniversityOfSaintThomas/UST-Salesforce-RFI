 - Created by Thaddaeus Dahlberg, Software Engineer, University of St. Thomas
 - Enhanced version for Interaction object with drag-and-drop sorting and inline editing
 -->

<template>
    <div class="slds-card slds-m-around_small">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="utility:questions_and_answers" size="small"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span>Interaction Questions Manager</span>
                    </h2>
                </div>
            </header>
            <div class="slds-no-flex">
                <lightning-button
                    variant="brand"
                    label="Add Question"
                    icon-name="utility:add"
                    onclick={openAddModal}
                ></lightning-button>
            </div>
        </div>

        <div class="slds-card__body slds-card__body_inner">
            <!-- Questions List with Drag and Drop -->
            <template lwc:if={showDataTable}>
                <div class="slds-text-body_small slds-m-bottom_small slds-text-color_weak">
                    <lightning-icon icon-name="utility:drag_and_drop" size="xx-small"></lightning-icon>
                    Drag questions to reorder, or use arrow buttons
                </div>

                <ul class="slds-has-dividers_around-space question-list">
                    <template for:each={questionJSON} for:item="question">
                        <li key={question.id}
                            class="slds-item question-item"
                            data-id={question.id}
                            draggable="true"
                            ondragstart={handleDragStart}
                            ondragend={handleDragEnd}
                            ondragover={handleDragOver}
                            ondragleave={handleDragLeave}
                            ondrop={handleDrop}>

                            <div class="slds-grid slds-gutters slds-p-around_small">
                                <!-- Drag Handle -->
                                <div class="slds-col slds-size_1-of-12 slds-text-align_center drag-handle">
                                    <lightning-icon
                                        icon-name="utility:rows"
                                        size="small"
                                        alternative-text="Drag to reorder"
                                    ></lightning-icon>
                                </div>

                                <!-- Question Details -->
                                <div class="slds-col slds-size_8-of-12">
                                    <div class="slds-grid slds-wrap slds-gutters_x-small">
                                        <div class="slds-col slds-size_1-of-1">
                                            <div class="slds-text-heading_small">{question.questionLabel}</div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2 slds-m-top_x-small">
                                            <span class="slds-text-body_small slds-text-color_weak">Type: </span>
                                            <lightning-badge label={question.questionType}></lightning-badge>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2 slds-m-top_x-small">
                                            <span class="slds-text-body_small slds-text-color_weak">Field: </span>
                                            <span class="slds-text-body_small">{question.fieldToApplyTo}</span>
                                        </div>
                                        <template lwc:if={question.position}>
                                            <div class="slds-col slds-size_1-of-2 slds-m-top_x-small">
                                                <span class="slds-text-body_small slds-text-color_weak">Position: </span>
                                                <span class="slds-text-body_small">{question.position}</span>
                                            </div>
                                        </template>
                                        <template lwc:if={question.valuesFlat}>
                                            <div class="slds-col slds-size_1-of-1 slds-m-top_x-small">
                                                <span class="slds-text-body_small slds-text-color_weak">Values: </span>
                                                <span class="slds-text-body_small">{question.valuesFlat}</span>
                                            </div>
                                        </template>
                                    </div>
                                </div>

                                <!-- Action Buttons -->
                                <div class="slds-col slds-size_3-of-12 slds-text-align_right">
                                    <lightning-button-group>
                                        <lightning-button-icon
                                            icon-name="utility:arrowup"
                                            alternative-text="Move Up"
                                            title="Move Up"
                                            data-id={question.id}
                                            onclick={moveUp}
                                        ></lightning-button-icon>
                                        <lightning-button-icon
                                            icon-name="utility:arrowdown"
                                            alternative-text="Move Down"
                                            title="Move Down"
                                            data-id={question.id}
                                            onclick={moveDown}
                                        ></lightning-button-icon>
                                        <lightning-button-icon
                                            icon-name="utility:edit"
                                            alternative-text="Edit"
                                            title="Edit"
                                            data-id={question.id}
                                            onclick={openEditModal}
                                        ></lightning-button-icon>
                                        <lightning-button-icon
                                            icon-name="utility:delete"
                                            alternative-text="Delete"
                                            title="Delete"
                                            variant="destructive"
                                            data-id={question.id}
                                            onclick={deleteQuestion}
                                        ></lightning-button-icon>
                                    </lightning-button-group>
                                </div>
                            </div>
                        </li>
                    </template>
                </ul>
            </template>

            <!-- Empty State -->
            <template lwc:else>
                <div class="slds-text-align_center slds-p-around_large">
                    <lightning-icon
                        icon-name="utility:warning"
                        size="large"
                        class="slds-m-bottom_small"
                    ></lightning-icon>
                    <p class="slds-text-heading_small">No questions configured</p>
                    <p class="slds-text-body_regular slds-m-top_small">
                        Click "Add Question" to create your first interaction question.
                    </p>
                </div>
            </template>
        </div>
    </div>

    <!-- Modal for Add/Edit Question -->
    <template lwc:if={showModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal Header -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close"
                            onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
                </header>

                <!-- Modal Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-grid slds-wrap slds-gutters">
                        <!-- Question Type -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-combobox
                                name="questionType"
                                label="Question Type"
                                value={inputItem.questionType}
                                placeholder="Select an option"
                                options={questionTypes}
                                onchange={handleChange}
                                required
                            ></lightning-combobox>
                        </div>

                        <!-- Position -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-combobox
                                name="position"
                                label="Position"
                                value={inputItem.position}
                                placeholder="Select an option"
                                options={positionOptions}
                                onchange={handleChange}
                                required
                            ></lightning-combobox>
                        </div>

                        <!-- Field to Apply To (not for static content) -->
                        <template lwc:if={isStaticContent}>
                            <!-- Skip field selection for static content -->
                        </template>
                        <template lwc:else>
                            <div class="slds-col slds-size_1-of-1">
                                <lightning-combobox
                                    name="fieldToApplyTo"
                                    label="Interaction Field to Apply to"
                                    value={inputItem.fieldToApplyTo}
                                    placeholder="Select an option"
                                    options={interactionFields}
                                    onchange={handleChange}
                                    required
                                ></lightning-combobox>
                            </div>
                        </template>

                        <!-- Question Label -->
                        <div class="slds-col slds-size_1-of-1">
                            <lightning-input
                                label="Question Label"
                                name="questionLabel"
                                value={inputItem.questionLabel}
                                onchange={handleChange}
                                required
                            ></lightning-input>
                        </div>

                        <!-- Assistive Text (for required fields, not static content) -->
                        <template lwc:if={isStaticContent}>
                            <!-- Skip assistive text for static content -->
                        </template>
                        <template lwc:else>
                            <template lwc:if={assistiveTextRequired}>
                                <div class="slds-col slds-size_1-of-1">
                                    <lightning-input
                                        label="Assistive Text"
                                        name="assistiveText"
                                        value={inputItem.assistiveText}
                                        onchange={handleChange}
                                        required={assistiveTextRequired}
                                    ></lightning-input>
                                </div>
                            </template>
                        </template>

                        <!-- Picklist Values -->
                        <template lwc:if={isPicklist}>
                            <div class="slds-col slds-size_1-of-1">
                                <lightning-textarea
                                    name="picklistValues"
                                    label="Picklist Values"
                                    value={inputItem.valuesFlat}
                                    placeholder="Enter one value per line"
                                    onchange={handleChange}
                                    required
                                ></lightning-textarea>
                                <div class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                                    Enter one value per line
                                </div>
                            </div>
                        </template>

                        <!-- Static Content -->
                        <template lwc:if={isStaticContent}>
                            <div class="slds-col slds-size_1-of-1">
                                <lightning-input-rich-text
                                    formats="font,color,bold,italic,underline,strike,link,code,blockquote,header,indent,outdent,align,clear,table,ul,ol,undo,redo"
                                    label="Static Content"
                                    name="staticContent"
                                    value={inputItem.valuesFlat}
                                    onchange={handleChange}
                                ></lightning-input-rich-text>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Modal Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button
                        variant="neutral"
                        label="Cancel"
                        onclick={closeModal}
                    ></lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Save"
                        onclick={saveQuestion}
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
