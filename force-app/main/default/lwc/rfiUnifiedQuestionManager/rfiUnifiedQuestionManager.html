<template>
    <lightning-card title="Unified Question Manager" icon-name="custom:custom63">
        <div class="slds-card__body slds-card__body_inner">

            <!-- Migration Banner -->
            <template if:true={showMigrationBanner}>
                <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium" role="alert">
                    <span class="slds-assistive-text">Info</span>
                    <h2>
                        <lightning-icon icon-name="utility:info" alternative-text="Info" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        Auto-migrated from legacy structure. Click "Save" to finalize.
                    </h2>
                </div>
            </template>

            <!-- Action Buttons -->
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col">
                    <lightning-button
                        label="Add Pre-configured Question"
                        icon-name="utility:add"
                        onclick={openAddPreconfiguredModal}
                        disabled={isLoading}>
                    </lightning-button>
                </div>
                <div class="slds-col">
                    <lightning-button
                        label="Add Custom Question"
                        icon-name="utility:new"
                        onclick={openAddCustomModal}
                        disabled={isLoading}>
                    </lightning-button>
                </div>
            </div>

            <!-- Questions List -->
            <template if:true={hasQuestions}>
                <div class="slds-m-bottom_medium">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col" style="width: 3rem;">
                                    <div class="slds-truncate" title="Order">#</div>
                                </th>
                                <th scope="col" style="width: 8rem;">
                                    <div class="slds-truncate" title="Type">Type</div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate" title="Question Label">Question Label</div>
                                </th>
                                <th scope="col" style="width: 8rem;">
                                    <div class="slds-truncate" title="Required">Required</div>
                                </th>
                                <th scope="col" style="width: 10rem;">
                                    <div class="slds-truncate" title="Actions">Actions</div>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={questions} for:item="question">
                                <tr key={question.id}
                                    class="slds-hint-parent question-row"
                                    draggable="true"
                                    data-index={question.id}
                                    ondragstart={handleDragStart}
                                    ondragend={handleDragEnd}
                                    ondragover={handleDragOver}
                                    ondrop={handleDrop}>

                                    <!-- Order Number -->
                                    <td data-label="#">
                                        <div class="slds-truncate">
                                            <lightning-icon icon-name="utility:drag_and_drop" size="x-small" class="drag-handle"></lightning-icon>
                                            {question.id}
                                        </div>
                                    </td>

                                    <!-- Type Badge -->
                                    <td data-label="Type">
                                        <div class="slds-truncate">
                                            <template if:true={question.type}>
                                                <span class="slds-badge slds-badge_lightest" if:true={question.typePreconfigured}>Pre-configured</span>
                                                <span class="slds-badge" if:false={question.typePreconfigured}>Custom</span>
                                            </template>
                                        </div>
                                    </td>

                                    <!-- Question Label (Editable) -->
                                    <td data-label="Question Label">
                                        <lightning-input
                                            type="text"
                                            value={question.questionLabel}
                                            data-index={question.id}
                                            onchange={handleLabelChange}
                                            variant="label-hidden">
                                        </lightning-input>
                                        <template if:true={question.fieldName}>
                                            <div class="slds-text-color_weak slds-text-body_small">
                                                Field: {question.fieldName}
                                            </div>
                                        </template>
                                        <template if:true={question.questionType}>
                                            <div class="slds-text-color_weak slds-text-body_small">
                                                Type: {question.questionType} → {question.fieldToApplyTo}
                                            </div>
                                        </template>
                                    </td>

                                    <!-- Required Checkbox -->
                                    <td data-label="Required">
                                        <template if:false={question.isStaticContent}>
                                            <lightning-input
                                                type="checkbox"
                                                checked={question.isRequired}
                                                data-index={question.id}
                                                onchange={handleInlineRequiredChange}
                                                variant="label-hidden">
                                            </lightning-input>
                                        </template>
                                    </td>

                                    <!-- Actions -->
                                    <td data-label="Actions">
                                        <lightning-button-group>
                                            <lightning-button-icon
                                                icon-name="utility:arrowup"
                                                alternative-text="Move Up"
                                                title="Move Up"
                                                data-id={question.id}
                                                onclick={moveUp}
                                                disabled={question.isFirst}
                                                variant="border-filled">
                                            </lightning-button-icon>
                                            <lightning-button-icon
                                                icon-name="utility:arrowdown"
                                                alternative-text="Move Down"
                                                title="Move Down"
                                                data-id={question.id}
                                                onclick={moveDown}
                                                disabled={question.isLast}
                                                variant="border-filled">
                                            </lightning-button-icon>
                                            <lightning-button-icon
                                                icon-name="utility:edit"
                                                alternative-text="Edit"
                                                title="Edit"
                                                data-id={question.id}
                                                onclick={openEditModal}
                                                variant="border-filled">
                                            </lightning-button-icon>
                                            <lightning-button-icon
                                                icon-name="utility:delete"
                                                alternative-text="Remove"
                                                title="Remove"
                                                data-id={question.id}
                                                onclick={deleteQuestion}
                                                variant="border-filled">
                                            </lightning-button-icon>
                                        </lightning-button-group>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <!-- No Questions Message -->
            <template if:false={hasQuestions}>
                <div class="slds-illustration slds-illustration_small slds-m-vertical_large">
                    <div class="slds-text-longform">
                        <h3 class="slds-text-heading_medium">No questions configured</h3>
                        <p class="slds-text-body_regular">Get started by adding pre-configured or custom questions above.</p>
                    </div>
                </div>
            </template>

            <!-- Save Button -->
            <div class="slds-m-top_medium">
                <lightning-button
                    variant="brand"
                    label="Save Configuration"
                    onclick={handleSave}
                    disabled={isLoading}
                    class="slds-float_right">
                </lightning-button>
            </div>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>
        </div>
    </lightning-card>

    <!-- Modal for Adding/Editing Questions -->
    <template if:true={showModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">

                    <!-- Add Pre-configured Field -->
                    <template lwc:if={isAddPreconfiguredMode}>
                        <lightning-combobox
                            name="preconfiguredField"
                            label="Select Pre-configured Field"
                            value={selectedPreconfiguredField}
                            options={availablePreconfiguredOptions}
                            onchange={handlePreconfiguredSelection}
                            required>
                        </lightning-combobox>
                    </template>

                    <!-- Add/Edit Custom Question -->
                    <template lwc:elseif={isCustomQuestion}>
                        <div class="slds-grid slds-gutters slds-wrap">
                            <div class="slds-col slds-size_1-of-1">
                                <lightning-input
                                    name="questionLabel"
                                    label="Question Label"
                                    value={currentQuestion.questionLabel}
                                    onchange={handleModalChange}
                                    required>
                                </lightning-input>
                            </div>

                            <div class="slds-col slds-size_1-of-1">
                                <lightning-combobox
                                    name="questionType"
                                    label="Question Type"
                                    value={currentQuestion.questionType}
                                    options={questionTypes}
                                    onchange={handleModalChange}
                                    required>
                                </lightning-combobox>
                            </div>

                            <template if:true={needsFieldMapping}>
                                <div class="slds-col slds-size_1-of-1">
                                    <lightning-combobox
                                        name="fieldToApplyTo"
                                        label="Interaction Field API Name"
                                        value={currentQuestion.fieldToApplyTo}
                                        options={interactionFieldOptions}
                                        onchange={handleModalChange}
                                        field-level-help="The Interaction__c field that will store this question's value. Options are filtered by the selected question type."
                                        required>
                                    </lightning-combobox>
                                </div>
                            </template>

                            <template if:true={isPicklist}>
                                <div class="slds-col slds-size_1-of-1">
                                    <lightning-textarea
                                        name="picklistValues"
                                        label="Picklist Values (one per line)"
                                        value={currentQuestion.valuesFlat}
                                        onchange={handleModalChange}
                                        required>
                                    </lightning-textarea>
                                </div>
                            </template>

                            <template if:true={isStaticContent}>
                                <div class="slds-col slds-size_1-of-1">
                                    <label class="slds-form-element__label">
                                        <abbr class="slds-required" title="required">*</abbr> Static Content
                                    </label>
                                    <lightning-input-rich-text
                                        value={currentQuestion.valuesFlat}
                                        onchange={handleStaticContentChange}
                                        placeholder="Enter static content...">
                                    </lightning-input-rich-text>
                                </div>
                            </template>

                            <template if:false={isStaticContent}>
                                <div class="slds-col slds-size_1-of-1">
                                    <lightning-input
                                        name="assistiveText"
                                        label="Help Text (Optional)"
                                        value={currentQuestion.assistiveText}
                                        onchange={handleModalChange}>
                                    </lightning-input>
                                </div>

                                <div class="slds-col slds-size_1-of-1">
                                    <lightning-input
                                        type="checkbox"
                                        label="Required"
                                        checked={currentQuestion.isRequired}
                                        onchange={handleRequiredChange}>
                                    </lightning-input>
                                </div>
                            </template>
                        </div>
                    </template>

                </div>

                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal}>Cancel</button>
                    <button class="slds-button slds-button_brand" onclick={saveQuestion}>Save</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
